    <path d="M39 36L29.5 47.5L39 59" stroke="#E0F2FE" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M57 36L66.5 47.5L57 59" stroke="#E0F2FE" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
