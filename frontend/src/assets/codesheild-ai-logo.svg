<svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">CodeSheildAI Logo</title>
  <desc id="desc">A shield-shaped code security mark with connected AI nodes.</desc>
  <defs>
    <linearGradient id="shieldFill" x1="16" y1="10" x2="82" y2="88" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C5CFF"/>
      <stop offset="0.52" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="innerFill" x1="28" y1="20" x2="69" y2="76" gradientUnits="userSpaceOnUse">
      <stop stop-color="#172554"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accent" x1="31" y1="34" x2="70" y2="64" gradientUnits="userSpaceOnUse">
